name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package is no longer published. Install only
          # the SDK components required by compileSdk 34.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Run lint
        run: ./gradlew lint --no-daemon

      - name: Run Detekt
        run: ./gradlew detekt --no-daemon

      - name: Run debug unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Run release unit tests
        run: ./gradlew :app:testReleaseUnitTest -x :app:verifyReleaseSigning --no-daemon

      - name: Create ephemeral release signing key
        shell: bash
        run: |
          keytool -genkeypair \
            -alias ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -keystore "$RUNNER_TEMP/momentum-ci.jks" \
            -storepass ci-password \
            -keypass ci-password \
            -dname "CN=Momentum CI, OU=Build, O=Momentum, C=US"
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/momentum-ci.jks"
            echo "RELEASE_STORE_PASSWORD=ci-password"
            echo "RELEASE_KEY_ALIAS=ci"
            echo "RELEASE_KEY_PASSWORD=ci-password"
          } >> "$GITHUB_ENV"

      - name: Assemble debug and release (R8)
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**
          if-no-files-found: warn
          retention-days: 7

  connected_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon

      - name: Upload connected test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-reports
          path: |
            app/build/reports/androidTests/**
            app/build/test-results/connected/**
          if-no-files-found: warn
          retention-days: 7

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run macrobenchmark and baseline profile collection
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: ./gradlew :benchmark:connectedCheck --no-daemon

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            benchmark/build/reports/**
            benchmark/build/outputs/**
            app/build/**/baselineProfiles/**
            app/src/**/baselineProfiles/**
          if-no-files-found: warn
          retention-days: 7
