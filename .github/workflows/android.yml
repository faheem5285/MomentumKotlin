name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package is no longer published. Install only
          # the SDK components required by compileSdk 34.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Run lint
        run: ./gradlew lint --no-daemon

      - name: Run Detekt
        run: ./gradlew detekt --no-daemon

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Create ephemeral release signing key
        shell: bash
        run: |
          keytool -genkeypair \
            -alias ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -keystore "$RUNNER_TEMP/momentum-ci.jks" \
            -storepass ci-password \
            -keypass ci-password \
            -dname "CN=Momentum CI, OU=Build, O=Momentum, C=US"
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/momentum-ci.jks"
            echo "RELEASE_STORE_PASSWORD=ci-password"
            echo "RELEASE_KEY_ALIAS=ci"
            echo "RELEASE_KEY_PASSWORD=ci-password"
          } >> "$GITHUB_ENV"

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --no-daemon
